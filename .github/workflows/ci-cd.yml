---
name: Lint, Test, and Publish

on:
  release:
    types: [published]
  pull_request:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/**.yml

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout
        uses: actions/checkout@v7

      - name: Step 2 - Setup Python

        uses: actions/setup-python@v7
        with:
          check-latest: true

      - name: Step 3 - Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Step 4 - Install External Linters
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck shfmt

      - name: Step 5 - Install Packages
        run: uv sync --frozen

      - name: Step 6 - Run Linters
        run: ./scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Checkout
        uses: actions/checkout@v7

      - name: Step 2 - Setup Python
        uses: actions/setup-python@v7
        with:
          check-latest: true

      - name: Step 3 - Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Step 4 - Install Packages
        run: uv sync --frozen

      - name: Step 5 - Run Tests
        run: |
          export PYTHONPATH=src/:$PYTHONPATH
          mkdir -p logs/
          uv run pytest --cov=govee_ble_client --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Step 6 - Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Run offline tests
        run: uv run --python "${{ matrix.python-version }}" pytest

  build-release:
    if: github.event_name == 'release'
    needs:
      - lint
      - test
      - python-compatibility
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Step 1 -Check out the repo
        uses: actions/checkout@v7

      - name: Step 2 - Setup Python
        uses: actions/setup-python@v7
        with:
          check-latest: true

      - name: Step 3 - Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Step 4 - Install Packages
        run: uv sync --frozen

      - name: Set project version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python - <<'PYCODE'
          import os
          import re

          version = re.sub(r"[^A-Za-z0-9.!+_-]", "", os.environ["RELEASE_TAG"].strip())
          if version.startswith(("v", "V")):
              version = version[1:]
          if not version or not version[0].isdigit():
              raise SystemExit("Release tag does not contain a valid version")
          print(version)
          PYCODE
          )"
          uv version "$version" --no-sync

      - name: Build package
        run: uv build

      - name: Store release distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    if: github.event_name == 'release'
    needs: build-release
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
