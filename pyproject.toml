[project]
name = "govee-ble"
version = "0.1.0"
description = "Async Bluetooth Low Energy discovery and protocol primitives for Govee devices"
readme = "README.md"
requires-python = ">=3.15"
license = { text = "MIT" }
authors = [{ name = "Govee BLE contributors" }]
dependencies = [
    "bleak>=3.0.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
